<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KlokMeester – Oefen met klokkijken</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blauw: #2c6fbb;
    --groen: #2e9e5b;
    --rood: #d9483b;
    --licht: #e3e9f2;
    --donker: #1d3557;
  }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--licht);
    color: var(--donker);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
  }
  h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin-bottom: 0.25rem; }
  .sub { color: #556; margin-bottom: 1.25rem; font-size: clamp(0.95rem, 2.5vw, 1.1rem); text-align: center; }
  .card {
    background: #fff;
    border-radius: 1rem;
    box-shadow: 0 4px 14px rgba(29,53,87,.12);
    padding: clamp(1rem, 3vw, 2rem);
    width: min(680px, 100%);
    text-align: center;
  }
  .opdracht { font-size: clamp(1.15rem, 3.2vw, 1.5rem); font-weight: 600; margin-bottom: 1rem; }
  .klok-wrap { display: flex; justify-content: center; margin-bottom: 1.25rem; }
  svg.klok { width: min(300px, 74vw); height: auto; touch-action: none; }
  svg.klok .grijp { cursor: grab; }
  .opties {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }
  .optie {
    font-size: clamp(1.1rem, 3vw, 1.35rem);
    font-weight: 600;
    padding: 0.9rem 1rem;
    border: 3px solid var(--blauw);
    border-radius: 0.8rem;
    background: #fff;
    color: var(--blauw);
    cursor: pointer;
    transition: transform .08s, background .15s;
    font-family: inherit;
  }
  .optie:active { transform: scale(.97); }
  .optie.goed { background: var(--groen); border-color: var(--groen); color: #fff; }
  .optie.fout { background: var(--rood); border-color: var(--rood); color: #fff; }
  .optie:disabled { cursor: default; opacity: .9; }
  .feedback {
    min-height: 1.6rem;
    margin-top: 0.35rem;
    margin-bottom: 0;
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    font-weight: 600;
  }
  .feedback.goed { color: var(--groen); }
  .feedback.fout { color: var(--rood); }
  @keyframes popup {
    0% { transform: scale(.6); opacity: 0; }
    60% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .feedback.goed, .feedback.fout { animation: popup .35s ease-out; }
  .sterren.pop { animation: popup .6s ease-out; }
  .voortgang {
    display: flex;
    gap: .35rem;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .voortgang span {
    width: clamp(14px, 3vw, 20px);
    height: clamp(14px, 3vw, 20px);
    border-radius: 50%;
    background: #d7e0ec;
  }
  .voortgang span.klaar { background: var(--blauw); }
  .knop {
    font-size: clamp(1.05rem, 3vw, 1.25rem);
    font-weight: 600;
    padding: 0.8rem 1.6rem;
    border: none;
    border-radius: 0.8rem;
    background: var(--blauw);
    color: #fff;
    cursor: pointer;
    margin-top: 1rem;
    font-family: inherit;
  }
  .knop:active { transform: scale(.97); }
  .knop.groot { font-size: clamp(1.2rem, 3.5vw, 1.5rem); padding: 0.9rem 2.2rem; }
  .knop.klaar {
    margin-top: 0;
  }
  .knop-plaatsing {
    display: flex;
    justify-content: center;
    margin-top: 0.15rem;
  }
  .knop-plaatsing .secuur {
    position: absolute;
    right: 0.6rem;
    bottom: 0.4rem;
  }
  .card { position: relative; }
  .sterren { font-size: clamp(2.2rem, 8vw, 3.2rem); letter-spacing: .3em; margin: .5rem 0 1rem; }
  .verborgen { display: none !important; }

  .kolom-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    width: min(960px, 100%);
  }
  @media (max-width: 560px) {
    .kolom-wrapper { grid-template-columns: 1fr; }
  }
  .kolom { text-align: left; }
  .kolom-kop {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    height: 54px;
    margin-bottom: 1rem;
    border-bottom: 3px solid #d7e0ec;
    padding-bottom: 0.75rem;
    box-sizing: content-box;
  }
  .kolom-kop h2 { font-size: clamp(1.2rem, 3.4vw, 1.5rem); color: var(--donker); }
  .kop-klok { width: 54px; height: 54px; flex: none; }
  .kop-digitaal {
    width: 54px;
    flex: none;
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    border: 3px solid var(--donker);
    border-radius: 0.4rem;
    padding: 0.35rem 0;
    font-variant-numeric: tabular-nums;
  }
  .niveaus {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.45rem;
  }
  #niveau-label { text-align: center; }
  .niveau-kaart {
    background: #fff;
    border: 2px solid var(--blauw);
    border-radius: 0.7rem;
    padding: 0.45rem 0.6rem;
    cursor: pointer;
    font-family: inherit;
    transition: transform .08s, box-shadow .15s;
  }
  .niveau-kaart:active { transform: scale(.97); }
  .niveau-kaart:hover { box-shadow: 0 4px 12px rgba(44,111,187,.25); }
  .niveau-kaart .nr { font-size: 0.85rem; color: #556; font-weight: 600; }
  .niveau-kaart .naam { font-size: clamp(0.85rem, 2.2vw, 1rem); font-weight: 700; color: var(--donker); margin: 0.1rem 0 0.15rem; min-height: 2.2em; display: flex; align-items: center; }
  .niveau-kaart .kaart-sterren { margin-top: 0.1rem; }
  .niveau-kaart .kaart-sterren { color: #f4b400; font-size: 1.1rem; letter-spacing: .12em; }
  .niveau-kaart.behaald { background: #e8f7ec; border-color: var(--groen); }
  .niveau-kaart.behaald .nr { color: #2e9e5b; }
  .daagtaak-kaart {
    width: min(960px, 100%);
    margin-top: 1rem;
    border-color: #f4b400;
    background: #fff9e8;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.7rem 1rem;
  }
  .daagtaak-kaart .naam { flex: 1; min-height: 0; justify-content: flex-start; }
  .daagtaak-kaart.behaald { background: #e8f7ec; border-color: var(--groen); }
  .daagtaak-kaart .kaart-sterren { flex: none; }

  .digitaal-instel {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 0;
    margin-bottom: 0;
  }
  .digitaal-instel .deel { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
  .digitaal-instel .waarde {
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 700;
    width: 2.1em;
    height: 1.3em;
    text-align: center;
    border: 3px solid var(--blauw);
    border-radius: 0.5rem;
    background: #fff;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
    padding: 0;
  }
  .digitaal-instel .stap {
    font-size: 1.3rem;
    font-weight: 700;
    width: 2.4rem;
    height: 2rem;
    border: 3px solid var(--blauw);
    border-radius: 0.6rem;
    background: #fff;
    color: var(--blauw);
    cursor: pointer;
  }
  .digitaal-instel .dubbelepunt {
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 700;
    line-height: 1.3;
    padding: 0 0.1rem;
    align-self: flex-start;
  }
  .hint { font-size: clamp(1rem, 2.8vw, 1.2rem); color: #556; margin-bottom: 0.75rem; }
  .digitaal-groot {
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: 700;
    margin-bottom: 1.25rem;
    font-variant-numeric: tabular-nums;
    letter-spacing: .05em;
  }
  .knop.secuur {
    background: none;
    color: #7a8aa0;
    border: none;
    font-size: clamp(0.85rem, 2.2vw, 1rem);
    padding: 0.4rem 0.8rem;
    margin-top: 2.5rem;
  }
  .login-form {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    max-width: 340px;
    margin: 0 auto 0.5rem;
  }
  .login-input {
    font-size: clamp(1.1rem, 3vw, 1.3rem);
    font-family: inherit;
    padding: 0.8rem 1rem;
    border: 3px solid var(--blauw);
    border-radius: 0.8rem;
    width: 100%;
  }
  #scherm-welkom .knop { display: block; margin: 0.6rem auto; min-width: min(300px, 80%); }
  #welkom-gast-hint { margin-top: 1rem; }
  .leerling-lijst {
    text-align: left;
    max-height: 300px;
    overflow-y: auto;
    border: 2px solid #d7e0ec;
    border-radius: 0.7rem;
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.5rem;
  }
  .leerling-lijst:empty::after { content: "Nog geen leerlingen."; color: #7a8aa0; }
  .leerling-rij {
    display: flex;
    justify-content: space-between;
    padding: 0.35rem 0;
    border-bottom: 1px solid #eef2f8;
    font-size: clamp(0.95rem, 2.5vw, 1.1rem);
  }
  .leerling-rij:last-child { border-bottom: none; }
  .leerling-rij .acties { display: flex; gap: 0.35rem; }
  .leerling-rij .acties button {
    font-size: 0.8rem;
    padding: 0.3rem 0.6rem;
    border: 2px solid var(--blauw);
    border-radius: 0.5rem;
    background: #fff;
    color: var(--blauw);
    cursor: pointer;
    font-family: inherit;
  }
  .leerling-rij .acties button.waarschuwing { border-color: var(--rood); color: var(--rood); }
  .resultaat-tabel { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .resultaat-tabel th, .resultaat-tabel td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #eef2f8; }
  .resultaat-tabel th { color: #556; font-weight: 600; }
  .mini-titel { font-weight: 700; margin: 0.75rem 0 0.25rem; }
  .account-balk {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(960px, 100%);
    margin-bottom: 0.5rem;
    font-size: clamp(0.9rem, 2.4vw, 1.05rem);
  }
  .account-balk .knop {
    margin-top: 0;
    padding: 0.4rem 1rem;
    font-size: clamp(0.85rem, 2.2vw, 1rem);
    background: none;
    color: #7a8aa0;
    border: 2px solid #c4cedd;
  }
  .account-balk.gast {
    justify-content: flex-end;
    gap: 0.75rem;
  }
  .voettekst {
    margin-top: 2rem;
    font-size: clamp(0.8rem, 2vw, 0.95rem);
    color: #7a8aa0;
  }
  .voettekst a {
    color: var(--blauw);
    font-weight: 600;
    text-decoration: none;
  }
  .voettekst a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>🕐 KlokMeester</h1>

<div id="scherm-welkom" class="card verborgen">
  <p class="sub">Ga je oefenen met klokkijken?</p>
  <button class="knop groot" id="knop-naar-login">Inloggen</button>
  <button class="knop groot" id="knop-gast">Zonder account oefenen</button>
  <p class="hint" id="welkom-gast-hint">Zonder account bewaart de app je sterren niet.</p>
</div>

<div id="scherm-login" class="card verborgen">
  <p class="sub">Log in met je account</p>
  <div class="login-form">
    <label class="verborgen" for="login-email">Inlognaam</label>
    <input type="text" id="login-email" class="login-input" placeholder="Inlognaam" autocomplete="username">
    <label class="verborgen" for="login-wachtwoord">Wachtwoord</label>
    <input type="password" id="login-wachtwoord" class="login-input" placeholder="Wachtwoord" autocomplete="current-password">
  </div>
  <button class="knop groot" id="knop-login">Inloggen</button>
  <p class="feedback" id="login-feedback"></p>
  <button class="knop secuur" id="knop-login-terug">◀ Terug</button>
</div>

<div id="scherm-docent" class="card verborgen">
  <p class="sub">Leerlingen van je klas</p>
  <div id="docent-lijst" class="leerling-lijst"></div>
  <button class="knop drukwerk" id="knop-print-klas">Printen / opslaan als PDF</button>
  <div id="klas-print"></div>
  <p class="sub" style="margin-top:1.5rem">Nieuwe leerling</p>
  <div class="login-form">
    <input type="text" id="nieuwe-roepnaam" class="login-input" placeholder="Roepnaam (bijv. Emma)">
    <input type="text" id="nieuwe-email" class="login-input" placeholder="Inlognaam (bijv. Emma6)">
    <input type="text" id="nieuwe-ww" class="login-input" placeholder="Wachtwoord (min. 6 tekens)">
  </div>
  <button class="knop" id="knop-nieuwe-leerling">Leerling aanmaken</button>
  <p class="feedback" id="docent-feedback"></p>
  <button class="knop secuur" id="knop-docent-terug">◀ Hoofdmenu</button>
</div>

<div id="startpagina">
  <div class="account-balk verborgen" id="account-balk">
    <span id="account-naam"></span>
    <span>
      <button class="knop verborgen" id="knop-docent-leerlingen">Leerlingen</button>
      <button class="knop" id="knop-uitloggen">Uitloggen</button>
    </span>
  </div>
  <div class="account-balk gast verborgen" id="gast-balk">
    <span>Wil je je resultaten opslaan, log dan in:</span>
    <button class="knop" id="knop-inloggen-start">Inloggen</button>
  </div>
  <div class="kolom-wrapper">
    <div class="kolom card">
      <div class="kolom-kop">
        <svg class="kop-klok" viewBox="-110 -110 220 220" aria-hidden="true"><circle r="100" fill="#fff" stroke="#1d3557" stroke-width="6"/><line x1="0" y1="0" x2="0" y2="-55" stroke="#1d3557" stroke-width="9" stroke-linecap="round"/><line x1="0" y1="0" x2="38" y2="31" stroke="#d9483b" stroke-width="6" stroke-linecap="round"/><circle r="7" fill="#1d3557"/><g font-size="18" font-weight="600" fill="#1d3557" text-anchor="middle"></g></svg>
        <h2>Analoog</h2>
      </div>
      <div class="niveaus" id="niveaus-analoog"></div>
    </div>
    <div class="kolom card">
      <div class="kolom-kop">
        <div class="kop-digitaal">21:35</div>
        <h2>Digitaal</h2>
      </div>
      <div class="niveaus" id="niveaus-digitaal"></div>
    </div>
  </div>
  <div class="niveaus" id="daagtaak-rij"></div>
</div>

<div id="scherm-oefenen" class="card verborgen">
  <p class="sub" id="niveau-label"></p>
  <div class="voortgang" id="voortgang"></div>
  <p class="opdracht" id="opdracht"></p>
  <p class="hint verborgen" id="hint"></p>
  <div class="digitaal-groot verborgen" id="digitaal-weergave"></div>
  <div class="klok-wrap" id="klok-wrap">
    <svg class="klok" id="klok" viewBox="-110 -110 220 220" aria-label="Analoge klok"></svg>
  </div>
  <div id="interactie"></div>
  <p class="feedback" id="feedback"></p>
  <div class="knop-plaatsing">
    <button class="knop verborgen" id="knop-klaar">Klaar!</button>
    <button class="knop secuur" id="knop-hoofdmenu">◀ Hoofdmenu</button>
  </div>
</div>

<div id="scherm-resultaat" class="card verborgen">
  <h2 id="resultaat-titel"></h2>
  <div class="sterren" id="sterren"></div>
  <p id="resultaat-tekst"></p>
  <button class="knop" id="knop-opnieuw">Nog een keer</button>
  <button class="knop" id="knop-terug">Terug naar niveaus</button>
</div>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script>
"use strict";

const AANTAL_OPDRACHTEN = 10;
const OPSLAG = "klokmeester_voortgang_v1";

const DAGDELEN = [
  { naam: "nacht", van: 0, tot: 6 },
  { naam: "ochtend", van: 6, tot: 12 },
  { naam: "middag", van: 12, tot: 18 },
  { naam: "avond", van: 18, tot: 24 }
];

const NIVEAUS = [
  { nr: 1, naam: "Hele en halve uren", type: "analoog", minuten: [0, 30], stap: 30 },
  { nr: 2, naam: "Kwart voor en kwart over", type: "analoog", minuten: [0, 15, 30, 45], stap: 15 },
  { nr: 3, naam: "5 en 10 minuten voor en over het hele uur", type: "analoog", minuten: [0, 5, 10, 50, 55], stap: 5 },
  { nr: 4, naam: "5 en 10 minuten voor en over het halve uur", type: "analoog", minuten: [20, 25, 30, 35, 40], stap: 5 },
  { nr: 5, naam: "Alle tijden, op de minuut nauwkeurig", type: "analoog", minuten: null, stap: 1 },
  { nr: 6, naam: "Hele en halve uren", type: "digitaal24", minuten: [0, 30], stap: 30 },
  { nr: 7, naam: "Kwart voor en kwart over", type: "digitaal24", minuten: [0, 15, 30, 45], stap: 15 },
  { nr: 8, naam: "5 en 10 minuten voor en over het hele uur", type: "digitaal24", minuten: [0, 5, 10, 50, 55], stap: 5 },
  { nr: 9, naam: "5 en 10 minuten voor en over het halve uur", type: "digitaal24", minuten: [20, 25, 30, 35, 40], stap: 5 },
  { nr: 10, naam: "Alle tijden, op de minuut nauwkeurig", type: "digitaal24", minuten: null, stap: 1 },
  { nr: 11, naam: "Mix van alles met lastige tijden", type: "daagtaak", minuten: null, stap: 1 }
];

const LASTIGE_TIJDEN = [
  { uur: 9, minuut: 58 },
  { uur: 11, minuut: 59 },
  { uur: 0, minuut: 0 },
  { uur: 0, minuut: 2 },
  { uur: 12, minuut: 0 },
  { uur: 12, minuut: 58 },
  { uur: 23, minuut: 58 },
  { uur: 17, minuut: 59 },
  { uur: 6, minuut: 1 }
];

const $ = (id) => document.getElementById(id);
const klokEl = $("klok");
const interactieEl = $("interactie");
const feedbackEl = $("feedback");
const voortgangEl = $("voortgang");
const opdrachtEl = $("opdracht");
const hintEl = $("hint");
const knopKlaar = $("knop-klaar");

function willekeurig(a) { return a[Math.floor(Math.random() * a.length)]; }

function maakTijd(niveau, type) {
  if (niveau.type === "daagtaak" && Math.random() < 0.4) {
    const t = willekeurig(LASTIGE_TIJDEN);
    let u = t.uur;
    if (type === "analoog") u = ((u + 11) % 12) + 1;
    return { uur: u, minuut: t.minuut };
  }
  const minuut = niveau.minuten ? willekeurig(niveau.minuten) : Math.floor(Math.random() * 60);
  let uur;
  if (type === "digitaal24") {
    uur = Math.floor(Math.random() * 24);
  } else {
    uur = 1 + Math.floor(Math.random() * 12);
  }
  return { uur, minuut };
}

function dagdeel(uur24) {
  return DAGDELEN.find((d) => uur24 >= d.van && uur24 < d.tot).naam;
}

function woordTijd(t) {
  const uur = ((t.uur + 11) % 12) + 1;
  const m = t.minuut;
  const volgend = (uur % 12) + 1;
  if (m === 0) return uur + " uur";
  if (m === 15) return "kwart over " + uur;
  if (m === 30) return "half " + volgend;
  if (m === 45) return "kwart voor " + volgend;
  if (m < 15) return m + " over " + uur;
  if (m < 30) return (30 - m) + " voor half " + volgend;
  if (m < 45) return (m - 30) + " over half " + volgend;
  return (60 - m) + " voor " + volgend;
}

function digitaalTijd(t, type) {
  const u = type === "digitaal24" ? t.uur : ((t.uur - 1) % 12) + 1;
  const mm = String(t.minuut).padStart(2, "0");
  return u + ":" + mm;
}

function tijdTekst(t, type) {
  if (type === "analoog") return woordTijd(t);
  return woordTijd(t) + " in de " + dagdeel(t.uur);
}

function toonKlok(uur, minuut, interactief, stap, wijzig) {
  const NS = "http://www.w3.org/2000/svg";
  klokEl.innerHTML = "";
  klokEl.classList.toggle("grijp", !!interactief);

  const cirkel = document.createElementNS(NS, "circle");
  cirkel.setAttribute("r", 100);
  cirkel.setAttribute("fill", "#fff");
  cirkel.setAttribute("stroke", "#1d3557");
  cirkel.setAttribute("stroke-width", 6);
  klokEl.appendChild(cirkel);

  for (let i = 0; i < 60; i++) {
    const isUur = i % 5 === 0;
    const streep = document.createElementNS(NS, "line");
    const len = isUur ? 12 : 6;
    const w = isUur ? 4 : 2;
    const x1 = Math.sin(i * Math.PI / 30) * 96;
    const y1 = -Math.cos(i * Math.PI / 30) * 96;
    const x2 = Math.sin(i * Math.PI / 30) * (96 - len);
    const y2 = -Math.cos(i * Math.PI / 30) * (96 - len);
    streep.setAttribute("x1", x1); streep.setAttribute("y1", y1);
    streep.setAttribute("x2", x2); streep.setAttribute("y2", y2);
    streep.setAttribute("stroke", "#1d3557");
    streep.setAttribute("stroke-width", w);
    streep.setAttribute("stroke-linecap", "round");
    klokEl.appendChild(streep);
  }

  for (let i = 1; i <= 12; i++) {
    const tekst = document.createElementNS(NS, "text");
    tekst.setAttribute("x", Math.sin(i * Math.PI / 6) * 68);
    tekst.setAttribute("y", -Math.cos(i * Math.PI / 6) * 68 + 7);
    tekst.setAttribute("text-anchor", "middle");
    tekst.setAttribute("font-size", 18);
    tekst.setAttribute("font-weight", 600);
    tekst.setAttribute("fill", "#1d3557");
    tekst.textContent = i;
    klokEl.appendChild(tekst);
  }

  const uurHoek = ((uur % 12) * 30 + minuut / 60 * 30) * Math.PI / 180;
  const minHoek = minuut * 6 * Math.PI / 180;

  const uurWijzer = document.createElementNS(NS, "line");
  uurWijzer.setAttribute("x1", 0); uurWijzer.setAttribute("y1", 0);
  uurWijzer.setAttribute("x2", Math.sin(uurHoek) * 50);
  uurWijzer.setAttribute("y2", -Math.cos(uurHoek) * 50);
  uurWijzer.setAttribute("stroke", "#1d3557");
  uurWijzer.setAttribute("stroke-width", 9);
  uurWijzer.setAttribute("stroke-linecap", "round");
  klokEl.appendChild(uurWijzer);

  const minuutWijzer = document.createElementNS(NS, "line");
  minuutWijzer.setAttribute("x1", 0); minuutWijzer.setAttribute("y1", 0);
  minuutWijzer.setAttribute("x2", Math.sin(minHoek) * 78);
  minuutWijzer.setAttribute("y2", -Math.cos(minHoek) * 78);
  minuutWijzer.setAttribute("stroke", "#d9483b");
  minuutWijzer.setAttribute("stroke-width", 6);
  minuutWijzer.setAttribute("stroke-linecap", "round");
  klokEl.appendChild(minuutWijzer);

  const midden = document.createElementNS(NS, "circle");
  midden.setAttribute("r", 7);
  midden.setAttribute("fill", "#1d3557");
  klokEl.appendChild(midden);

  if (interactief) {
    uurWijzer.classList.add("grijp");
    minuutWijzer.classList.add("grijp");
    let sleepDoel = null;

    const puntNaarTijd = (event, doel) => {
      const rect = klokEl.getBoundingClientRect();
      const schaal = 220 / rect.width;
      const x = (event.clientX - rect.left - rect.width / 2) * schaal;
      const y = (event.clientY - rect.top - rect.height / 2) * schaal;
      let hoek = Math.atan2(x, -y) * 180 / Math.PI;
      if (hoek < 0) hoek += 360;
      if (doel === "minuut") {
        let m = Math.round(hoek / 6) % 60;
        m = Math.round(m / stap) * stap;
        if (stap === 60 || (stap > 1 && m % stap !== 0)) m = Math.round(hoek / (6 * stap)) * stap % 60;
        return { minuut: ((m % 60) + 60) % 60 };
      }
      return { uur: Math.round(hoek / 30) % 12 };
    };

    const startSleep = (event, doel) => {
      sleepDoel = doel;
      event.preventDefault();
      klokEl.setPointerCapture && klokEl.setPointerCapture(event.pointerId);
    };

    uurWijzer.addEventListener("pointerdown", (e) => startSleep(e, "uur"));
    minuutWijzer.addEventListener("pointerdown", (e) => startSleep(e, "minuut"));

    klokEl.addEventListener("pointermove", (event) => {
      if (!sleepDoel) return;
      event.preventDefault();
      const delta = puntNaarTijd(event, sleepDoel);
      if (sleepDoel === "minuut") wijzig({ minuut: delta.minuut });
      else wijzig({ uur: delta.uur });
    });
    klokEl.addEventListener("pointerup", () => { sleepDoel = null; });
    klokEl.addEventListener("pointercancel", () => { sleepDoel = null; });
  }
}

function toetsOpties(juisteTijd, niveau, type) {
  const juisteTekst = tijdTekst(juisteTijd, type);
  const opties = new Set([juisteTekst]);
  let beveiliging = 0;
  while (opties.size < 4 && beveiliging++ < 1000) {
    const kandidaat = maakTijd(niveau, type);
    let tekst = tijdTekst(kandidaat, type);
    if (tekst === juisteTekst) continue;
    if (type === "digitaal24" && Math.random() < 0.4) {
      tekst = woordTijd(kandidaat) + " in de " + willekeurig(DAGDELEN).naam;
      if (tekst === juisteTekst) continue;
    }
    opties.add(tekst);
  }
  while (opties.size < 4 && beveiliging++ < 2000) opties.add("–");
  return Array.from(opties).sort(() => Math.random() - 0.5);
}

function toonVoortgang() {
  voortgangEl.innerHTML = "";
  for (let i = 0; i < AANTAL_OPDRACHTEN; i++) {
    const stip = document.createElement("span");
    if (i < opdrachtNummer) stip.classList.add("klaar");
    voortgangEl.appendChild(stip);
  }
}

let niveau = null;
let modus = null;
let opdrachtType = "analoog";
let huidigeTijd = null;
let ingesteldeTijd = null;
let opdrachtNummer = 0;
let score = 0;
let vergrendeld = false;

function kiesModus(niv, type) {
  if (type === "analoog") {
    return willekeurig(["aanwijzen", "instellenAnaloog"]);
  }
  return willekeurig(["aanwijzen", "instellenDigitaal"]);
}

function nieuweOpdracht() {
  opdrachtNummer++;
  vergrendeld = false;
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  hintEl.classList.add("verborgen");
  hintEl.textContent = "";
  knopKlaar.classList.add("verborgen");
  interactieEl.innerHTML = "";
  interactieEl.className = "";
  $("digitaal-weergave").classList.add("verborgen");
  $("klok-wrap").classList.remove("verborgen");
  opdrachtType =
    niveau.type === "analoog" ||
    (niveau.type === "daagtaak" && willekeurig(["analoog", "digitaal24"]) === "analoog")
      ? "analoog" : "digitaal24";
  huidigeTijd = maakTijd(niveau, opdrachtType);
  modus = kiesModus(niveau, opdrachtType);
  toonVoortgang();

  if (modus === "aanwijzen") {
    opdrachtEl.textContent = "Hoe laat is het?";
    if (opdrachtType !== "analoog") {
      const weergave = $("digitaal-weergave");
      weergave.textContent = digitaalTijd(huidigeTijd, opdrachtType);
      weergave.classList.remove("verborgen");
      $("klok-wrap").classList.add("verborgen");
    } else {
      toonKlok(huidigeTijd.uur, huidigeTijd.minuut, false);
    }
    const opties = toetsOpties(huidigeTijd, niveau, opdrachtType);
    const div = document.createElement("div");
    div.className = "opties";
    opties.forEach((tekst) => {
      const knop = document.createElement("button");
      knop.className = "optie";
      knop.textContent = tekst;
      knop.style.fontSize = "clamp(0.95rem, 2.6vw, 1.2rem)";
      knop.style.padding = "0.7rem 0.5rem";
      knop.addEventListener("click", () => beantwoordMeerkeuze(tekst, knop));
      div.appendChild(knop);
    });
    interactieEl.appendChild(div);
  } else if (modus === "instellenAnaloog") {
    opdrachtEl.textContent = "Zet de wijzers op: " + tijdTekst(huidigeTijd, opdrachtType);
    ingesteldeTijd = { uur: 12, minuut: 0 };
    const teken = () => toonKlok(ingesteldeTijd.uur, ingesteldeTijd.minuut, true, niveau.stap, (d) => {
      if (d.minuut !== undefined) ingesteldeTijd.minuut = d.minuut;
      if (d.uur !== undefined) ingesteldeTijd.uur = d.uur === 0 ? 12 : d.uur;
      teken();
    });
    teken();
    knopKlaar.classList.remove("verborgen");
  } else {
    opdrachtEl.textContent = "Stel deze tijd in op de digitale klok:";
    const weergave = $("digitaal-weergave");
    weergave.textContent = tijdTekst(huidigeTijd, opdrachtType);
    weergave.classList.remove("verborgen");
    $("klok-wrap").classList.add("verborgen");
    const maxUur = opdrachtType === "digitaal24" ? 23 : 12;
    const minUur = opdrachtType === "digitaal24" ? 0 : 1;
    ingesteldeTijd = { uur: minUur, minuut: 0 };
    const div = document.createElement("div");
    div.className = "digitaal-instel";
    const maakDeel = (label, waardeF, plusF, minF, zetHandmatig) => {
      const deel = document.createElement("div");
      deel.className = "deel";
      const omhoog = document.createElement("button");
      omhoog.className = "stap";
      omhoog.textContent = "+";
      const waarde = document.createElement("input");
      waarde.type = "text";
      waarde.inputMode = "numeric";
      waarde.className = "waarde";
      waarde.maxLength = 2;
      const omlaag = document.createElement("button");
      omlaag.className = "stap";
      omlaag.textContent = "–";
      const naam = document.createElement("div");
      naam.className = "hint";
      naam.textContent = label;
      const ververs = () => { waarde.value = waardeF(); };
      omhoog.addEventListener("click", () => { plusF(); ververs(); });
      omlaag.addEventListener("click", () => { minF(); ververs(); });
      waarde.addEventListener("input", () => {
        const n = parseInt(waarde.value, 10);
        if (!isNaN(n)) zetHandmatig(n);
      });
      waarde.addEventListener("blur", ververs);
      ververs();
      deel.appendChild(omhoog);
      deel.appendChild(waarde);
      deel.appendChild(omlaag);
      deel.appendChild(naam);
      return deel;
    };
    const zetUur = (d) => {
      ingesteldeTijd.uur += d;
      if (ingesteldeTijd.uur > maxUur) ingesteldeTijd.uur = minUur;
      if (ingesteldeTijd.uur < minUur) ingesteldeTijd.uur = maxUur;
    };
    const zetMinuut = (d) => {
      ingesteldeTijd.minuut += d * niveau.stap;
      if (ingesteldeTijd.minuut > 59) ingesteldeTijd.minuut -= 60;
      if (ingesteldeTijd.minuut < 0) ingesteldeTijd.minuut += 60;
    };
    const zetUurHandmatig = (n) => {
      if (n >= minUur && n <= maxUur) ingesteldeTijd.uur = n;
    };
    const zetMinuutHandmatig = (n) => {
      if (n >= 0 && n <= 59) ingesteldeTijd.minuut = n;
    };
    div.appendChild(maakDeel("uur", () => String(ingesteldeTijd.uur).padStart(2, "0"), () => zetUur(1), () => zetUur(-1), zetUurHandmatig));
    const dubbelePunt = document.createElement("div");
    dubbelePunt.className = "dubbelepunt";
    dubbelePunt.textContent = ":";
    div.appendChild(dubbelePunt);
    div.appendChild(maakDeel("minuten", () => String(ingesteldeTijd.minuut).padStart(2, "0"), () => zetMinuut(1), () => zetMinuut(-1), zetMinuutHandmatig));
    interactieEl.appendChild(div);
    knopKlaar.classList.remove("verborgen");
  }
}

function juisteIngesteldeTijd() {
  if (modus === "instellenDigitaal") {
    return ingesteldeTijd.uur === huidigeTijd.uur && ingesteldeTijd.minuut === huidigeTijd.minuut;
  }
  const doelUur = huidigeTijd.uur % 12;
  const ingesteldUur = ((ingesteldeTijd.uur % 12) + 12) % 12;
  return ingesteldUur === doelUur && ingesteldeTijd.minuut === huidigeTijd.minuut;
}

function goedAntwoordTekst() {
  if (modus === "instellenDigitaal") return digitaalTijd(huidigeTijd, opdrachtType);
  if (opdrachtType === "analoog") return woordTijd(huidigeTijd);
  return digitaalTijd(huidigeTijd, opdrachtType);
}

const GOEDE_TEKSTEN = ["Goed gedaan! 🌟", "Klopt helemaal! 🎉", "Super! ⭐", "Yes, goedzo! 🎈", "Heel knap! 👍"];

function willekeurigeGoedeTekst() {
  return GOEDE_TEKSTEN[Math.floor(Math.random() * GOEDE_TEKSTEN.length)];
}

function verwerkAntwoord(goed, toonJuist) {
  vergrendeld = true;
  knopKlaar.classList.add("verborgen");
  if (goed) {
    score++;
    feedbackEl.textContent = willekeurigeGoedeTekst();
    feedbackEl.classList.add("goed");
  } else {
    feedbackEl.textContent = "Helaas, het was " + toonJuist + ".";
    feedbackEl.classList.add("fout");
    if (modus === "instellenAnaloog") {
      toonKlok(huidigeTijd.uur, huidigeTijd.minuut, false);
    }
  }
  setTimeout(() => {
    if (opdrachtNummer < AANTAL_OPDRACHTEN) nieuweOpdracht();
    else toonResultaat();
  }, 1600);
}

function beantwoordMeerkeuze(tekst, knop) {
  if (vergrendeld) return;
  vergrendeld = true;
  const juisteTekst = tijdTekst(huidigeTijd, opdrachtType);
  const knoppen = interactieEl.querySelectorAll("button");
  knoppen.forEach((k) => {
    k.disabled = true;
    if (k.textContent === juisteTekst) k.classList.add("goed");
  });
  if (tekst === juisteTekst) {
    score++;
    feedbackEl.textContent = willekeurigeGoedeTekst();
    feedbackEl.classList.add("goed");
  } else {
    knop.classList.add("fout");
    feedbackEl.textContent = "Helaas, het was " + juisteTekst + ".";
    feedbackEl.classList.add("fout");
  }
  setTimeout(() => {
    if (opdrachtNummer < AANTAL_OPDRACHTEN) nieuweOpdracht();
    else toonResultaat();
  }, 1600);
}

const dienIn = () => {
  if (vergrendeld) return;
  if (knopKlaar.classList.contains("verborgen")) return;
  verwerkAntwoord(juisteIngesteldeTijd(), goedAntwoordTekst());
};
knopKlaar.addEventListener("click", dienIn);
document.addEventListener("keydown", (event) => {
  if (event.key === "Enter") dienIn();
});

function sterrenVoorScore(score, totaal) {
  const v = score / totaal;
  if (v >= 0.9) return 3;
  if (v >= 0.6) return 2;
  if (v >= 0.3) return 1;
  return 0;
}

let serverRecords = {};

function laadVoortgang() {
  if (Auth.ingelogd() && Auth.isLeerling()) return serverRecords;
  try { return JSON.parse(localStorage.getItem(OPSLAG)) || {}; }
  catch { return {}; }
}

function bewaarSterren(nr, sterren) {
  const voortgang = laadVoortgang();
  if ((voortgang[nr] || -1) < sterren) {
    voortgang[nr] = sterren;
    localStorage.setItem(OPSLAG, JSON.stringify(voortgang));
  }
}

  "scherm-welkom", "scherm-login", "scherm-docent",
  "startpagina", "scherm-oefenen", "scherm-resultaat"
];

}

  $("account-balk").classList.toggle("verborgen", !ingelogd);
  $("gast-balk").classList.toggle("verborgen", ingelogd);
  $("knop-docent-leerlingen").classList.toggle("verborgen", !(ingelogd && Auth.isDocent()));
  if (ingelogd) {
    $("account-naam").textContent =
      "Hoi " + Auth.gebruiker().roepnaam + (Auth.isDocent() ? " (docent)" : "");
  }
  const voortgang = laadVoortgang();
  const containerAnaloog = $("niveaus-analoog");
  const containerDigitaal = $("niveaus-digitaal");
  const containerDaagtaak = $("daagtaak-rij");
  containerAnaloog.innerHTML = "";
  containerDigitaal.innerHTML = "";
  containerDaagtaak.innerHTML = "";
  NIVEAUS.forEach((niv) => {
    const behaald = voortgang[niv.nr];
    const kaart = document.createElement("button");
    kaart.className = "niveau-kaart" + (behaald !== undefined && behaald > 0 ? " behaald" : "");
    const sterrenTekst = behaald === undefined
      ? "☆☆☆"
      : "★".repeat(behaald) + "☆".repeat(3 - behaald);
    kaart.innerHTML =
      '<div class="nr">Niveau ' + niv.nr + "</div>" +
      '<div class="naam">' + niv.naam + "</div>" +
      '<div class="kaart-sterren">' + sterrenTekst + "</div>";
    kaart.addEventListener("click", () => startSessie(niv));
    if (niv.type === "analoog") containerAnaloog.appendChild(kaart);
    else if (niv.type === "digitaal24") containerDigitaal.appendChild(kaart);
    else {
      kaart.classList.add("daagtaak-kaart");

      titel.className = "nr";
      titel.textContent = "\u2b50 Extra uitdaging";
      kaart.replaceChild(titel, kaart.querySelector(".nr"));
      containerDaagtaak.appendChild(kaart);
    }
  });
}

function startSessie(niv) {
  niveau = niv;
  score = 0;
  opdrachtNummer = 0;
  $("startpagina").classList.add("verborgen");
  $("scherm-resultaat").classList.add("verborgen");
  $("scherm-oefenen").classList.remove("verborgen");
  $("niveau-label").textContent =
    (niv.type === "analoog" ? "Analoog \u2013 " : "") +
    (niv.type === "digitaal24" ? "Digitaal \u2013 " : "") +
    (niv.type === "daagtaak" ? "Daagtaak \u2013 " : "niveau " + niv.nr + ": ") +
    niv.naam;
  nieuweOpdracht();
}

function toonResultaat() {
  $("scherm-oefenen").classList.add("verborgen");
  $("scherm-resultaat").classList.remove("verborgen");
  const sterren = sterrenVoorScore(score, AANTAL_OPDRACHTEN);
  const eerderBeste = (laadVoortgang()[niveau.nr] || -1);
  if (Auth.ingelogd() && Auth.isLeerling()) {
    Auth.bewaarResultaat(niveau.nr, score, AANTAL_OPDRACHTEN, sterren).then((ok) => {
      if (ok) Auth.laadRecords().then((r) => { serverRecords = r; });
    });
  } else {
    bewaarSterren(niveau.nr, sterren);
  }
  const sterrenEl = $("sterren");
  sterrenEl.textContent = "★".repeat(sterren) + "☆".repeat(3 - sterren);
  sterrenEl.classList.remove("pop");
  void sterrenEl.offsetWidth;
  sterrenEl.classList.add("pop");
  $("resultaat-titel").textContent =
    "Je hebt " + score + " van de " + AANTAL_OPDRACHTEN + " goed!";
  let tekst;
  if (sterren === 3) tekst = "Top! Je beheerst dit niveau.";
  else if (sterren >= 1) tekst = "Nog een keer oefenen? Je wordt er beter van!";
  else tekst = "Blijf oefenen, je gaat het leren!";
  if (eerderBeste >= 0 && sterren > eerderBeste) tekst += " Nieuw record!";
  $("resultaat-tekst").textContent = tekst;
}

    rijen.forEach((r) => {
      const tr = document.createElement("tr");
      const datum = new Date(r.created_at).toLocaleDateString("nl-NL");
      tr.innerHTML = "<td>" + datum + "</td><td>Niveau " + r.niveau + "</td><td>" + r.goed + " / " + r.totaal + "</td><td>" + "\u2605".repeat(r.sterren) + "\u2606".repeat(3 - r.sterren) + "</td>";
      tabel.appendChild(tr);
    });
    lijst.appendChild(tabel);
  }
  const terug = document.createElement("button");
  terug.className = "knop secuur";
  terug.style.marginTop = "1rem";
  terug.textContent = "\u25c0 Terug naar leerlingen";
  terug.addEventListener("click", toonDocentScherm);
  lijst.appendChild(terug);
}

async function wijzigRoepnaam(leerling) {
  const naam = prompt("Nieuwe roepnaam voor " + leerling.roepnaam + ":", leerling.roepnaam);
  if (naam === null) return;
  const nieuw = naam.trim();
  if (!nieuw || nieuw === leerling.roepnaam) return;
  const fb = $("docent-feedback");
  try {
    await Auth.zetRoepnaam(leerling.user_id, nieuw);
    fb.textContent = "Roepnaam gewijzigd.";
    fb.className = "feedback goed";
    toonDocentScherm();
  } catch (e) {
    fb.textContent = "Dat lukte niet.";
    fb.className = "feedback fout";
  }
}

async function resetWachtwoord(leerling) {
  const ww = prompt("Nieuw wachtwoord voor " + leerling.roepnaam + " (min. 6 tekens):");
  if (!ww) return;
  const fb = $("docent-feedback");
  try {
    await Auth.resetWachtwoord(leerling.user_id, ww);
    fb.textContent = "Wachtwoord gewijzigd voor " + leerling.roepnaam + ".";
    fb.className = "feedback goed";
  } catch (e) {
    fb.textContent = "Dat lukte niet. Is het wachtwoord lang genoeg?";
    fb.className = "feedback fout";
  }
}

async function verwijderLeerling(leerling, rij) {
  if (!confirm(leerling.roepnaam + " verwijderen? Alle resultaten gaan ook weg. Dit kan niet meer terug.")) return;
  const fb = $("docent-feedback");
  try {
    await Auth.verwijderLeerling(leerling.user_id);
    fb.textContent = leerling.roepnaam + " is verwijderd.";
    fb.className = "feedback goed";
    rij.remove();
  } catch (e) {
    fb.textContent = "Verwijderen mislukt.";
    fb.className = "feedback fout";
  }
}

function toonLogin() {
  toonScherm("scherm-login");
  $("login-feedback").textContent = "";
  $("login-feedback").className = "feedback";
  $("login-email").value = "";
  $("login-wachtwoord").value = "";
  $("scherm-login").classList.remove("verborgen");
  $("login-email").focus();
}

$("knop-print-klas").addEventListener("click", () => window.print());

$("knop-naar-login").addEventListener("click", toonLogin);
$("knop-login-terug").addEventListener("click", toonWelkom);
$("knop-gast").addEventListener("click", () => { toonStartpagina(); });

$("knop-inloggen-start").addEventListener("click", toonLogin);
$("knop-docent-leerlingen").addEventListener("click", toonDocentScherm);
$("knop-docent-terug").addEventListener("click", toonStartpagina);

$("knop-nieuwe-leerling").addEventListener("click", async () => {
  const roepnaam = $("nieuwe-roepnaam").value.trim();
  const inlognaam = $("nieuwe-email").value.trim();
  const wachtwoord = $("nieuwe-ww").value;
  const fb = $("docent-feedback");
  fb.textContent = "";
  fb.className = "feedback";
  if (!roepnaam || !inlognaam || !wachtwoord) {
    fb.textContent = "Vul alle drie de vakjes in.";
    fb.classList.add("fout");
    return;
  }
  if (wachtwoord.length < 6) {
    fb.textContent = "Het wachtwoord is te kort (min. 6 tekens).";
    fb.classList.add("fout");
    return;
  }
  try {
    await Auth.maakLeerling(inlognaam, wachtwoord, roepnaam);
    fb.textContent = roepnaam + " is toegevoegd!";
    fb.classList.add("goed");
    $("nieuwe-roepnaam").value = "";
    $("nieuwe-email").value = "";
    $("nieuwe-ww").value = "";
    const lijst = $("docent-lijst");
    lijst.innerHTML = "";
    (await Auth.laadKlas()).forEach((r) => {
      const div = document.createElement("div");
      div.className = "leerling-rij";
      div.innerHTML = "<span>" + r.roepnaam + "</span><span>\u2713</span>";
      lijst.appendChild(div);
    });
  } catch (e) {
    fb.textContent = "Dat lukte niet. Bestaat de gebruikersnaam al?";
    fb.classList.add("fout");
  }
});

$("knop-uitloggen").addEventListener("click", () => {
  Auth.uitloggen();
  serverRecords = {};
  toonWelkom();
});

async function voerLoginUit() {
  const inlognaam = $("login-email").value.trim();
  const wachtwoord = $("login-wachtwoord").value;
  if (!inlognaam || !wachtwoord) {
    $("login-feedback").textContent = "Vul je inlognaam en wachtwoord in.";
    $("login-feedback").classList.add("fout");
    return;
  }
  $("knop-login").disabled = true;
  $("login-feedback").textContent = "";
  try {
    await Auth.login(inlognaam, wachtwoord);
    if (Auth.isLeerling()) serverRecords = await Auth.laadRecords();
    toonStartpagina();
  } catch (e) {
    $("login-feedback").textContent = "Dat lukte niet. Probeer het nog eens.";
    $("login-feedback").classList.add("fout");
  }
  $("knop-login").disabled = false;
}

$("knop-login").addEventListener("click", voerLoginUit);
$("scherm-login").addEventListener("keydown", (e) => {
  if (e.key === "Enter") voerLoginUit();
});

(async function start() {
  if (!Auth.beschikbaar) { toonWelkom(); return; }
  try {
    const gebruiker = await Auth.herstelSessie();
    if (gebruiker && Auth.isLeerling()) serverRecords = await Auth.laadRecords();
  } catch {}
  if (Auth.ingelogd()) toonStartpagina();
  else toonWelkom();
})();
</script>
